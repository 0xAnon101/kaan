name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Proves the release variant still compiles. The APK is unsigned and is not published.
      - name: Build release variant
        run: ./gradlew assembleRelease --stacktrace

      - name: Check release permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -E "android\.permission\.(INTERNET|REQUEST_INSTALL_PACKAGES)'"; then
            echo "::error::The release build must not request INTERNET or REQUEST_INSTALL_PACKAGES"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kaan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # One release per versionCode. A second build of the same versionCode replaces the APK.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | grep -oE '[0-9]+' | head -n 1)
          NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/' | head -n 1)
          TAG="build-$CODE"
          cp app/build/outputs/apk/debug/app-debug.apk kaan-debug.apk
          {
            echo "Kaan $NAME, debug build."
            echo
            echo "versionCode=$CODE"
            echo
            echo "Commit $GITHUB_SHA"
            echo
            echo "Signed with the public debug key. For testing only."
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" kaan-debug.apk --clobber
            gh release edit "$TAG" --title "Kaan build $CODE" --notes-file notes.md --latest
          else
            gh release create "$TAG" kaan-debug.apk --target "$GITHUB_SHA" --title "Kaan build $CODE" --notes-file notes.md --latest
          fi
